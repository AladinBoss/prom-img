<description><![CDATA[<p><b>Масажер для шиї у формі підкови</b> створений для тих, хто багато годин проводить за комп'ютером, кермом або в дорозі. Усередині працює механізм, що відтворює розминальні рухи, а разом із вібрацією та інфрачервоним теплом він допомагає зняти скутість у шийному відділі після довгого робочого дня.</p><h2>Як працює</h2><p>Пристрій має два типи масажного впливу — розминання та вібрацію — і три рівні інтенсивності. Підігрів та вібрація вмикаються незалежно, тому ви самі обираєте, яким буде сеанс: лише тепло, лише розминання або все разом. Через приблизно 15 хвилин масажер вимикається автоматично — таймер вбудований.</p><h2>Автономність</h2><p>Живлення від вбудованого акумулятора, заряджання через роз'єм USB Type-C (5 В, потужність 7 Вт). Жодних дротів під час використання — зручно і вдома на дивані, і в автомобілі, і в літаку.</p><h2>Конструкція</h2><ul><li>Ергономічна U-подібна форма підтримує голову і шию у природному положенні.</li><li>М'яке текстильне покриття, приємне до шкіри.</li><li>Регульований шнурок із фіксатором надійно утримує подушку на місці.</li><li>Панель із чотирьох кнопок: живлення, режим (M), підігрів, інтенсивність. Для ввімкнення утримуйте кнопку живлення близько 2 секунд.</li></ul><h2>У коробці</h2><ul><li>Масажна подушка — 1 шт.</li><li>Інструкція — 1 шт.</li><li>Заводська упаковка.</li></ul><p>Колір — сірий. Товар новий.</p>]]></description>
